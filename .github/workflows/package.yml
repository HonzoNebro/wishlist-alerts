name: Package Wishlist Alerts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.zip.outputs.filename }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build installable ZIP
        id: zip
        shell: bash
        run: |
          version=$(sed -nE 's/^## Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' WishlistAlerts/WishlistAlerts.toc)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exactly one major.minor.patch version in WishlistAlerts.toc"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag must match the TOC version (v$version)"
            exit 1
          fi

          filename="WishlistAlerts-$version.zip"
          git archive --format=zip --output="$filename" HEAD WishlistAlerts/
          unzip -t "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: WishlistAlerts-package
          path: ${{ steps.zip.outputs.filename }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: WishlistAlerts-package

      - name: Publish ZIP on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ needs.package.outputs.zip }}
        run: |
          tag="$GITHUB_REF_NAME"
          if assets=$(gh release view "$tag" --json assets --jq '.assets[].name'); then
            if ! grep -Fxq -- "$ZIP" <<< "$assets"; then
              gh release upload "$tag" "$ZIP"
            fi
          else
            gh release create "$tag" "$ZIP" --verify-tag --title "$tag" --generate-notes
          fi
